<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="276" viewBox="0 0 900 276" role="img" aria-label="Animated agent loop: perceive, plan, act, observe, reflect" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06b6d4"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="0%" r="110%">
      <stop offset="0" stop-color="#161d33"/>
      <stop offset="1" stop-color="#0b0f1a"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1a2340"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="276" rx="16" fill="url(#bg)"/>
  <rect width="900" height="276" rx="16" fill="url(#dots)"/>
  <rect x="0.5" y="0.5" width="899" height="275" rx="16" fill="none" stroke="#243056"/>
  <path id="loop" d="M110 100 H790 C860 100 860 190 790 190 H110 C40 190 40 100 110 100 Z" fill="none" stroke="#1f2a44" stroke-width="2"/>
  <path d="M110 100 H790 C860 100 860 190 790 190 H110 C40 190 40 100 110 100 Z" fill="none" stroke="url(#g)" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 12" opacity="0.9">
    <animate attributeName="stroke-dashoffset" from="0" to="-180" dur="4s" repeatCount="indefinite"/>
  </path>
  <circle cx="378" cy="139" r="4" fill="#22c55e">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="390" y="144" font-family="'Fira Code','SF Mono',Consolas,Menlo,monospace" font-size="15" font-weight="700" fill="#e2e8f0">agent.run(goal)</text>
  <text x="450" y="166" text-anchor="middle" font-family="'Fira Code','SF Mono',Consolas,Menlo,monospace" font-size="12" fill="#8ea0c8">plan -&gt; act -&gt; observe -&gt; reflect</text>
  <circle cx="200" cy="100" r="22" fill="none" stroke="#22d3ee" stroke-width="2">
    <animate attributeName="r" values="22;38;38" keyTimes="0;0.14;1" dur="9s" begin="0.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0;0" keyTimes="0;0.14;1" dur="9s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="100" r="22" fill="#0d1324" stroke="url(#g)" stroke-width="2"/>
  <text x="200" y="105" text-anchor="middle" font-family="'Fira Code','SF Mono',Consolas,Menlo,monospace" font-size="13" font-weight="700" fill="#67e8f9">01</text>
  <text x="200" y="50" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#f1f5f9">Perceive</text>
  <text x="200" y="66" text-anchor="middle" font-family="'Fira Code','SF Mono',Consolas,Menlo,monospace" font-size="11" fill="#7c8db5">RAG · context</text>
  <circle cx="450" cy="100" r="22" fill="none" stroke="#22d3ee" stroke-width="2">
    <animate attributeName="r" values="22;38;38" keyTimes="0;0.14;1" dur="9s" begin="1.9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0;0" keyTimes="0;0.14;1" dur="9s" begin="1.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="100" r="22" fill="#0d1324" stroke="url(#g)" stroke-width="2"/>
  <text x="450" y="105" text-anchor="middle" font-family="'Fira Code','SF Mono',Consolas,Menlo,monospace" font-size="13" font-weight="700" fill="#67e8f9">02</text>
  <text x="450" y="50" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#f1f5f9">Plan</text>
  <text x="450" y="66" text-anchor="middle" font-family="'Fira Code','SF Mono',Consolas,Menlo,monospace" font-size="11" fill="#7c8db5">LLM reasoning</text>
  <circle cx="700" cy="100" r="22" fill="none" stroke="#22d3ee" stroke-width="2">
    <animate attributeName="r" values="22;38;38" keyTimes="0;0.14;1" dur="9s" begin="3.3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0;0" keyTimes="0;0.14;1" dur="9s" begin="3.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="100" r="22" fill="#0d1324" stroke="url(#g)" stroke-width="2"/>
  <text x="700" y="105" text-anchor="middle" font-family="'Fira Code','SF Mono',Consolas,Menlo,monospace" font-size="13" font-weight="700" fill="#67e8f9">03</text>
  <text x="700" y="50" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#f1f5f9">Act</text>
  <text x="700" y="66" text-anchor="middle" font-family="'Fira Code','SF Mono',Consolas,Menlo,monospace" font-size="11" fill="#7c8db5">tools · MCP</text>
  <circle cx="575" cy="190" r="22" fill="none" stroke="#22d3ee" stroke-width="2">
    <animate attributeName="r" values="22;38;38" keyTimes="0;0.14;1" dur="9s" begin="5.7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0;0" keyTimes="0;0.14;1" dur="9s" begin="5.7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="575" cy="190" r="22" fill="#0d1324" stroke="url(#g)" stroke-width="2"/>
  <text x="575" y="195" text-anchor="middle" font-family="'Fira Code','SF Mono',Consolas,Menlo,monospace" font-size="13" font-weight="700" fill="#67e8f9">04</text>
  <text x="575" y="242" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#f1f5f9">Observe</text>
  <text x="575" y="258" text-anchor="middle" font-family="'Fira Code','SF Mono',Consolas,Menlo,monospace" font-size="11" fill="#7c8db5">results · traces</text>
  <circle cx="325" cy="190" r="22" fill="none" stroke="#22d3ee" stroke-width="2">
    <animate attributeName="r" values="22;38;38" keyTimes="0;0.14;1" dur="9s" begin="7.1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0;0" keyTimes="0;0.14;1" dur="9s" begin="7.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="325" cy="190" r="22" fill="#0d1324" stroke="url(#g)" stroke-width="2"/>
  <text x="325" y="195" text-anchor="middle" font-family="'Fira Code','SF Mono',Consolas,Menlo,monospace" font-size="13" font-weight="700" fill="#67e8f9">05</text>
  <text x="325" y="242" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#f1f5f9">Reflect</text>
  <text x="325" y="258" text-anchor="middle" font-family="'Fira Code','SF Mono',Consolas,Menlo,monospace" font-size="11" fill="#7c8db5">evals · HITL</text>
  <circle r="3" fill="#22d3ee" opacity="0.35" filter="url(#glow)">
    <animateMotion dur="9s" begin="-0.45s" repeatCount="indefinite"><mpath xlink:href="#loop"/></animateMotion>
  </circle>
  <circle r="4" fill="#a78bfa" opacity="0.6" filter="url(#glow)">
    <animateMotion dur="9s" begin="-0.25s" repeatCount="indefinite"><mpath xlink:href="#loop"/></animateMotion>
  </circle>
  <circle r="6" fill="#ffffff" opacity="1" filter="url(#glow)">
    <animateMotion dur="9s" begin="0s" repeatCount="indefinite"><mpath xlink:href="#loop"/></animateMotion>
  </circle>
</svg>
